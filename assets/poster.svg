<svg viewBox="0 0 680 430" width="680" height="430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>麦当劳 MCP 35 个接口实测结果</title>
<desc>35 个接口中 27 个实测调通，7 个写操作默认不调用，1 个缺参数；可获取 281 个派对城市、158 个餐品营养、50 件积分商品、15 个在售餐品。抽奖 10 连抽花 240 积分，期望换回 30.2 积分。</desc>
<rect width="680" height="430" fill="#FFFFFF"/>

<text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="500" fill="#2C2C2A">麦当劳 MCP 的 35 个接口，我全跑了一遍</text>
<text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#5F5E5A">服务端实际暴露 35 个，官方文档写的是 33 个</text>

